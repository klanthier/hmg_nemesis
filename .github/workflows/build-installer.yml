name: Build Nemesis installation packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      JAVA_VERSION: '17.0.17+10'
      BUILD_TOOLS_VERSION: '30.0.3'
      NDK_VERSION: '21.4.7075529'
      ANDROID_PLATFORM: 'android-30'
      SDK_TOOLS_BUILD: '13114758'
      SDK_TOOLS_SHA256: '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee'
      USB_TEMPLATE_URL: 'https://github.com/xwtk/hmg_nemesis/releases/download/v1.16.9/nemesis-usb-update-package.7z'
    steps:
      - name: Check out the source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install the pinned Android toolchain
        shell: bash
        run: |
          NEMESIS_ANDROID_SDK="$RUNNER_TEMP/nemesis-android-sdk"
          echo "NEMESIS_ANDROID_SDK=$NEMESIS_ANDROID_SDK" >> "$GITHUB_ENV"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${SDK_TOOLS_BUILD}_latest.zip" \
            --output "$tools_zip"
          printf '%s  %s\n' "$SDK_TOOLS_SHA256" "$tools_zip" | sha256sum -c -
          mkdir -p "$NEMESIS_ANDROID_SDK/cmdline-tools"
          unzip -q "$tools_zip" -d "$NEMESIS_ANDROID_SDK/cmdline-tools"
          mv "$NEMESIS_ANDROID_SDK/cmdline-tools/cmdline-tools" \
            "$NEMESIS_ANDROID_SDK/cmdline-tools/pinned"
          sdkmanager="$NEMESIS_ANDROID_SDK/cmdline-tools/pinned/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers"
          "$sdkmanager" --sdk_root="$NEMESIS_ANDROID_SDK" --licenses \
            < "$RUNNER_TEMP/android-license-answers"
          "$sdkmanager" --sdk_root="$NEMESIS_ANDROID_SDK" --install \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION"
          echo "$NEMESIS_ANDROID_SDK/build-tools/$BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      - name: Prepare the checksum-pinned full USB template
        shell: bash
        run: |
          if ! command -v 7z >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          NEMESIS_USB_INPUT_DIR="$RUNNER_TEMP/nemesis-usb-input"
          mkdir -p "$NEMESIS_USB_INPUT_DIR"
          echo "NEMESIS_USB_INPUT_DIR=$NEMESIS_USB_INPUT_DIR" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 "$USB_TEMPLATE_URL" \
            --output "$NEMESIS_USB_INPUT_DIR/upstream-usb.7z"
          python3 "NEMESIS Source/tools/prepare_usb_template.py" \
            --archive "$NEMESIS_USB_INPUT_DIR/upstream-usb.7z" \
            --output-dir "$NEMESIS_USB_INPUT_DIR"

      - name: Run host tests
        run: |
          make -C "NEMESIS Source" test-meta
          python3 "NEMESIS Source/tests/setup_press_test.py"
          python3 "NEMESIS Source/tests/store_logic_test.py"
          python3 "NEMESIS Source/tests/test_check_built_tar.py"
          python3 "NEMESIS Source/tests/test_check_built_update.py"
          python3 "NEMESIS Source/tests/test_check_built_usb.py"

      - name: Compile and package fresh binaries
        shell: bash
        run: |
          make -C "NEMESIS Source" clean
          make -C "USB package path" clean
          rm -f "NEMESIS Source/manager/nemesis.keystore" "USB package path/installer/nemesis.keystore"
          make -C "USB package path" \
            TEMPLATE="$NEMESIS_USB_INPUT_DIR/template.tar" \
            NDK="$NEMESIS_ANDROID_SDK/ndk/$NDK_VERSION" \
            ANDROID_JAR="$NEMESIS_ANDROID_SDK/platforms/$ANDROID_PLATFORM/android.jar"
          # Reuse the exact Manager bytes from the USB build; invoking another
          # phony manager Make target would re-sign the APK after packaging it.
          python3 "USB OTA troubleShooter path/make_troubleshooter_tar.py"
          sh "USB OTA troubleShooter path/verify_tars.sh"
          mkdir -p "NEMESIS Source/out"
          version=$(sed -n 's/^#define NEMESIS_VERSION "\([0-9.]*\)"/\1/p' "NEMESIS Source/native/nemesis.h")
          python3 "NEMESIS Source/tools/make_update_zip.py" -o "NEMESIS Source/out/nemesis-update-$version.zip"
          python3 "NEMESIS Source/tests/check_built_tar.py"
          python3 "NEMESIS Source/tests/check_built_update.py"
          python3 "NEMESIS Source/tests/check_built_installer.py"
          python3 "NEMESIS Source/tests/check_built_usb.py" --template "$NEMESIS_USB_INPUT_DIR/template.tar"
          git diff --exit-code HEAD

      - name: Package and verify the complete USB installation
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/NEMESIS Source/out/nemesis-usb-update-package.7z"
          rm -f "$archive"
          (cd "USB package path/out" && 7z a -t7z -mx=9 "$archive" ./*)
          7z t "$archive"
          mkdir -p "$RUNNER_TEMP/nemesis-usb-roundtrip"
          7z x -y "$archive" "-o$RUNNER_TEMP/nemesis-usb-roundtrip"
          python3 "NEMESIS Source/tests/check_built_usb.py" \
            --template "$NEMESIS_USB_INPUT_DIR/template.tar" \
            --out "$RUNNER_TEMP/nemesis-usb-roundtrip"

      - name: Record the source, toolchain, and artifact hashes
        run: python3 "NEMESIS Source/tools/write_build_info.py"

      - name: Upload the newly built installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemesis-installer-${{ github.sha }}
          path: |
            dist/ota_package.tar
            dist/nemesis-usb-update-package.7z
            dist/usb-template-info.json
            dist/nemesis-update-*.zip
            dist/NEMESIS.data
            dist/NEMESIS-Installer.apk
            dist/SHA256SUMS
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30

  attest:
    # PRs and non-default manual branches build with a read-only token and are
    # not signed as default-branch builds. No project code runs in this job.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download this run's installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nemesis-installer-${{ github.sha }}
          path: dist

      - name: Check the transferred files
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attest the installer and build record
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ota_package.tar
            dist/nemesis-usb-update-package.7z
            dist/usb-template-info.json
            dist/nemesis-update-*.zip
            dist/NEMESIS.data
            dist/NEMESIS-Installer.apk
            dist/build-info.json
          create-storage-record: false

      - name: Upload the signed attestation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nemesis-provenance-${{ github.sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
